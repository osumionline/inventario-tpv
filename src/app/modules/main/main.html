<mat-sidenav-container class="container">
    <mat-sidenav #sidenav
                 [(opened)]="opened"
                 mode="over">
        <mat-toolbar>
            <mat-toolbar-row>
                <span>Inventario TPV</span>
            </mat-toolbar-row>
        </mat-toolbar>
        <mat-nav-list>
            <a mat-list-item
               routerLink="/profile">
                <mat-icon matListItemIcon>edit</mat-icon>
                Editar perfil
            </a>
            <a mat-list-item
               routerLink="/profile">
                <mat-icon matListItemIcon>logout</mat-icon>
                Cerrar sesión
            </a>
        </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content>
        <mat-toolbar>
            <mat-toolbar-row>
                <button mat-icon-button
                        (click)="showMenu()">
                    <mat-icon>menu</mat-icon>
                </button>
                <span class="spacer">Inventario TPV</span>
            </mat-toolbar-row>
        </mat-toolbar>
    </mat-sidenav-content>
</mat-sidenav-container>
